  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  max-width:420px;
  width:100%;
  text-align:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:32px 24px;
}
.icon-box{
  background:#FFFFFF;
  border-radius:14px;
  padding:20px;
  margin-bottom:22px;
}
.icon-box img{width:100%;max-width:220px;display:block;margin:0 auto}
h1{font-size:22px;font-weight:700;margin-bottom:10px}
p{font-size:15px;color:var(--text-dim);line-height:1.7;margin-bottom:8px}
.spinner{
  width:26px;height:26px;
  border:3px solid var(--line);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:22px auto 18px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{
  display:inline-block;
  margin-top:6px;
  background:var(--accent);
  color:var(--accent-text);
  border:none;
  border-radius:10px;
  padding:12px 28px;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>
