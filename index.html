<script>
/* ============================================================
   CONFIG — SERVICES

   the sheet changes (new service, renamed slug, new price),
   update BOTH the sheet and this array by hand.
   ============================================================ */

  { id: 6549173, slug: "mens-haircut",       name: "תספורת גברים ונוער",        price: 50 },
  { id: 6668077, slug: "haircut-beard",      name: "תספורת + זקן",              price: 55 },

  { id: 6668094, slug: "beard-trim",         name: "סידור זקן",                 price: 30 },
  { id: 6668107, slug: "haircut-wash-beard", name: "תספורת + חפיפה + זקן",       price: 60 },
  { id: 6668113, slug: "soldier-haircut",    name: "תספורת חייל",               price: 50 },
];

/* ============================================================
   CONFIG — ENDPOINTS & RULES
   ============================================================ */
const CONFIG = {
  // Cal.com booking pages live at this base + /<slug>
  CAL_COM_BASE_URL: "https://cal.com/flowmind-ai",

  // TODO: replace with the real [07] Mini App Gateway webhook URL
  // once that scenario is built. action=check_customer expected to
  // return: { recent_no_show_count: <number> }
  NO_SHOW_CHECK_ENDPOINT: "https://hook.eu1.make.com/r8rn3qrw211o13gjulanu938p7y1mj2b",

  // Matches [01]'s existing gate: >= this many no-shows in the last
  // 180 days forces online-only payment.

  // If true, skips the real network call and pretends the customer
  // has 0 recent no-shows. Useful for testing the UI before [07]

};
</script>

#app{max-width:480px;margin:0 auto;padding:24px 20px 40px}
.screen.hidden{display:none}

.app-header{position:relative;margin-bottom:24px;padding-top:8px}
.app-header h1{font-size:22px;font-weight:700;line-height:1.3}
.app-header h1.main-title{text-align:center}
.subtitle{color:var(--text-dim);font-size:14px;margin-top:4px}

.hero-photo{
  display:block;
  width:100%;
  height:150px;
  object-fit:cover;
  object-position:top center;
  border-radius:14px;
  border:1px solid var(--line);
  margin-bottom:20px;
}

.back-link{
  background:none;border:none;color:var(--accent);
  font-family:inherit;font-size:15px;font-weight:500;
  padding:0 0 12px;cursor:pointer;
}

.list{display:flex;flex-direction:column;gap:10px}

.row{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}
.row:active{background:var(--surface-hi)}
.row-name{font-size:16px;font-weight:500}
.row-meta{color:var(--text-dim);font-size:14px;margin-top:2px}
.row-price{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;margin-inline-start:16px}

.row.primary{
  background:var(--accent);
  border-color:var(--accent);
}
.row.primary .row-name{color:var(--accent-text);font-weight:700}
.row.primary .row-meta{color:var(--accent-text);opacity:.75}

.note{
  margin-top:16px;
  font-size:13px;
  color:var(--danger);
  line-height:1.6;
  text-align:center;
}
.note.hidden{display:none}

.overlay{
  position:fixed;inset:0;
  background:rgba(27,25,23,.6);
  display:flex;align-items:center;justify-content:center;
}
.overlay.hidden{display:none}
.spinner{
  width:28px;height:28px;
  border:3px solid var(--line);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{
  position:fixed;bottom:20px;left:20px;right:20px;
  max-width:440px;margin:0 auto;
  background:var(--danger);color:#fff;
  padding:14px 16px;border-radius:10px;
  font-size:14px;text-align:center;
}
.banner.hidden{display:none}
</style>

<script>
/* ============================================================
   Telegram WebApp bootstrap
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// chat_id comes from the same source [01] already uses server-side
// (Callback Query > From > ID) — here it's the Mini App launch user.
// Falls back to a URL param for local/browser testing outside Telegram.
function getChatId() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    return tg.initDataUnsafe.user.id;
  }
  const params = new URLSearchParams(window.location.search);
  return params.get('chat_id') || 'TEST_USER';
}

/* ============================================================
   Small helpers
   ============================================================ */
function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = message;
  show(banner);
  setTimeout(() => hide(banner), 4000);
}

async function checkNoShowStatus(chatId) {
  if (CONFIG.MOCK_NO_SHOW_CHECK) {
    return { recent_no_show_count: 0 };
  }
  const res = await fetch(CONFIG.NO_SHOW_CHECK_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'check_customer', chat_id: chatId }),
  });
  if (!res.ok) throw new Error('no_show_check_failed');
  return res.json();
}

function buildCalComUrl(service, paymentMethod, chatId) {
  const url = new URL(`${CONFIG.CAL_COM_BASE_URL}/${service.slug}`);
  url.searchParams.set('chat_id', chatId);
  url.searchParams.set('payment_method', paymentMethod);
  return url.toString();
}

function redirectToBooking(service, paymentMethod) {
  const url = buildCalComUrl(service, paymentMethod, getChatId());
  if (tg) {
    tg.openLink(url);
  } else {
    window.location.href = url;
  }
}

/* ============================================================
   Screen 1 — service picker
   ============================================================ */
function renderServices() {
  const list = document.getElementById('service-list');
  list.innerHTML = '';
  SERVICES.forEach(service => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div>
        <div class="row-name">${service.name}</div>
      </div>
      <div class="row-price">₪${service.price}</div>
    `;
    row.addEventListener('click', () => selectService(service));
    list.appendChild(row);
  });
}

/* ============================================================
   Screen 2 — payment choice
   ============================================================ */
async function selectService(service) {
  const loading = document.getElementById('loading');
  show(loading);
  try {
    const status = await checkNoShowStatus(getChatId());
    hide(loading);
    openPaymentScreen(service, status.recent_no_show_count);
  } catch (err) {
    hide(loading);
    showError('לא הצלחנו לבדוק את הסטטוס שלך, נסה שוב.');
  }
}

function openPaymentScreen(service, noShowCount) {
  document.getElementById('payment-service-name').textContent = service.name;
  document.getElementById('payment-price').textContent = `₪${service.price}`;

  const forcedOnline = noShowCount >= CONFIG.NO_SHOW_THRESHOLD;
  const options = document.getElementById('payment-options');
  options.innerHTML = '';

  if (!forcedOnline) {
    const cashRow = document.createElement('div');
    cashRow.className = 'row';
    cashRow.innerHTML = `<div class="row-name">💵 מזומן בחנות</div>`;
    cashRow.addEventListener('click', () => redirectToBooking(service, 'cash'));
    options.appendChild(cashRow);
  }

  const onlineRow = document.createElement('div');
  onlineRow.className = 'row primary';
  onlineRow.innerHTML = `<div class="row-name">💳 תשלום מלא אונליין</div>`;
  onlineRow.addEventListener('click', () => redirectToBooking(service, 'online'));
  options.appendChild(onlineRow);

  const note = document.getElementById('online-only-note');
  if (forcedOnline) show(note); else hide(note);

  hide(document.getElementById('screen-services'));
  show(document.getElementById('screen-payment'));
}

document.getElementById('back-to-services').addEventListener('click', () => {
  hide(document.getElementById('screen-payment'));
  show(document.getElementById('screen-services'));
});

/* ============================================================
   Init
   ============================================================ */
renderServices();
</script>

</body>
</html>
