  .card {
    background: #1a1d27;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9ea8; font-size: 14px; margin-bottom: 20px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #2a2d3a;
    font-size: 14px;
    text-align: right;
  }
  .row span:first-child { color: #9a9ea8; }
  .prompt { font-size: 15px; margin: 22px 0 16px; color: #d8dae0; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .confirm-btn { background: #34d17c; color: #0f1117; }
  .cancel-btn { background: #ff5a5a; color: #1a1d27; }
  .back-btn { background: #2a2d3a; color: #f2f2f2; }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .status.ok { background: rgba(52,209,124,0.15); color: #34d17c; display: block; }
  .status.err { background: rgba(255,90,90,0.15); color: #ff5a5a; display: block; }
  .done-msg { font-size: 18px; font-weight: 600; margin: 22px 0 6px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="serviceLine">טוען פרטי תור…</h1>
    <div class="sub" id="dateLine">–</div>

    <div class="row"><span>מזהה תור</span><span id="bookingUid">–</span></div>

    <div id="loadingState">
      <div class="prompt">טוען…</div>
    </div>

    <div id="promptState" style="display:none">
      <div class="prompt">נשמח לדעת אם אתה מגיע לתור מחר:</div>
      <button class="confirm-btn" onclick="sendAction('confirm_attendance')">✅ מגיע</button>
      <button class="cancel-btn" onclick="showCancelConfirm()">❌ לא מגיע, בטל</button>
    </div>

    <div id="cancelConfirmState" style="display:none">
      <div class="prompt">⚠️ לחיצה נוספת תבטל את התור לצמיתות.</div>
      <button class="cancel-btn" onclick="sendAction('cancel')">כן, בטל את התור</button>
      <button class="back-btn" onclick="hideCancelConfirm()">🔙 חזרה</button>
    </div>

    <div id="pastState" style="display:none">
      <div class="done-msg" style="display:block;">תודה שהיית אצלנו! 💈</div>
    </div>

    <div class="done-msg" id="doneMsg"></div>

    <div id="status" class="status"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const bookingUid = params.get("booking_uid") || "";
  const startAtRaw = params.get("start_at") || "";
  const service = params.get("service") || "";
  const chatId = params.get("chat_id") || "";
  const webhookUrl = params.get("webhook") || "";

  document.getElementById("bookingUid").textContent = bookingUid || "—";
  document.getElementById("serviceLine").textContent = service || "פרטי תור";
  document.getElementById("dateLine").textContent = startAtRaw || "–";

  // Parse DD/MM/YYYY HH:mm into a Date object (same pattern as manage-booking.html)
  function parseStart(raw) {
    const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
    if (!m) return null;
    const [, dd, mm, yyyy, hh, min] = m;
    return new Date(`${yyyy}-${mm}-${dd}T${hh}:${min}:00`);
  }
  const startDate = parseStart(startAtRaw);
  const appointmentHasPassed = startDate ? (new Date() >= startDate) : false;

  async function checkStatusOnLoad() {
    const loadingState = document.getElementById("loadingState");
    const promptState = document.getElementById("promptState");

    if (appointmentHasPassed) {
      loadingState.style.display = "none";
      document.getElementById("pastState").style.display = "block";
      return;
    }

    if (!webhookUrl || !bookingUid) {
      loadingState.style.display = "none";
      promptState.style.display = "block";
      return;
    }
    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ booking_uid: bookingUid, action: "check_status" })
      });
      const data = await res.json().catch(() => ({}));
      loadingState.style.display = "none";
      if (data.confirmation_status === "confirmed" || data.booking_status === "cancelled") {
        const doneMsg = document.getElementById("doneMsg");
        doneMsg.style.display = "block";
        doneMsg.textContent = "כבר טופל בעבר — אין צורך לפעול שוב.";
      } else {
        promptState.style.display = "block";
      }
    } catch (err) {
      // status check failing shouldn't block the page — buttons stay available as fallback
      loadingState.style.display = "none";
      promptState.style.display = "block";
    }
  }
  checkStatusOnLoad();

  function showCancelConfirm() {
    document.getElementById("promptState").style.display = "none";
    document.getElementById("cancelConfirmState").style.display = "block";
  }
  function hideCancelConfirm() {
    document.getElementById("cancelConfirmState").style.display = "none";
    document.getElementById("promptState").style.display = "block";
  }

  let actionInFlight = false;

  async function sendAction(action) {
    if (actionInFlight) return;
    actionInFlight = true;

    const promptState = document.getElementById("promptState");
    const cancelConfirmState = document.getElementById("cancelConfirmState");
    cancelConfirmState.style.display = "none";
    const doneMsg = document.getElementById("doneMsg");
    const statusEl = document.getElementById("status");
    statusEl.className = "status";
    statusEl.textContent = "שולח…";
    statusEl.style.display = "block";

    if (!webhookUrl || !bookingUid) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאה: חסרים פרטים בכתובת הדף.";
      actionInFlight = false;
      return;
    }

    const payload = { booking_uid: bookingUid, action: action, chat_id: chatId };

    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        if (data.status === "already_actioned") {
          promptState.style.display = "none";
          doneMsg.style.display = "block";
          statusEl.style.display = "none";
          doneMsg.textContent = "כבר טופל בעבר — אין צורך לפעול שוב.";
          return;
        }
        promptState.style.display = "none";
        doneMsg.style.display = "block";
        statusEl.style.display = "none";
        doneMsg.textContent = action === "confirm_attendance"
          ? "✅ מעולה, נתראה מחר! 💈"
          : "התור בוטל. מקווים לראותך בפעם הבאה!";
      } else {
        statusEl.className = "status err";
        statusEl.textContent = "שגיאה מהשרת (" + res.status + ").";
      }
    } catch (err) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאת רשת: " + err.message;
    } finally {
      actionInFlight = false;
    }
  }
</script>
</body>
