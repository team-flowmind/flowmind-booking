<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowMind – תשלום (הדמיה)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1117;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1a1d27;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .badge {
    display: inline-block;
    background: #ffb020;
    color: #1a1d27;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9ea8; font-size: 14px; margin-bottom: 22px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #2a2d3a;
    font-size: 14px;
  }
  .row span:first-child { color: #9a9ea8; }
  .amount {
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    margin: 22px 0;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .pay-btn { background: #34d17c; color: #0f1117; }
  .fail-btn { background: #2a2d3a; color: #f2f2f2; }
  .status {
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .status.ok { background: rgba(52,209,124,0.15); color: #34d17c; display: block; }
  .status.err { background: rgba(255,90,90,0.15); color: #ff5a5a; display: block; }
  .config-note {
    margin-top: 18px;
    font-size: 12px;
    color: #6b6f7a;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">מצב הדמיה — לא תשלום אמיתי</span>
    <h1>תשלום עבור התור</h1>
    <div class="sub" id="serviceLine">טוען פרטי הזמנה…</div>

    <div class="row"><span>מזהה הזמנה</span><span id="bookingUid">–</span></div>
    <div class="row"><span>סכום</span><span id="amountLine">–</span></div>

    <div class="amount" id="amountBig">₪–</div>

    <button class="pay-btn" onclick="sendResult('paid')">✅ סמלץ תשלום מוצלח</button>
    <button class="fail-btn" onclick="sendResult('failed')">❌ סמלץ תשלום נכשל</button>

    <div id="status" class="status"></div>

    <div class="config-note">דף הדמיה זמני עד לבחירת ספק תשלום אמיתי (Grow / Takbull)</div>
  </div>

<script>
  // ---- Configuration ----
  // Set this to your Make "04.payment_webhook" scenario's webhook URL,
  // or override per-link with ?webhook=<url> in the query string.
  const DEFAULT_WEBHOOK_URL = "";

  const params = new URLSearchParams(window.location.search);
  const bookingUid = params.get("booking_uid") || "";
  const amount = params.get("amount") || "0";
  const service = params.get("service") || "";
  const webhookUrl = params.get("webhook") || DEFAULT_WEBHOOK_URL;

  document.getElementById("bookingUid").textContent = bookingUid || "—";
  document.getElementById("amountLine").textContent = amount ? ("₪" + amount) : "—";
  document.getElementById("amountBig").textContent = "₪" + (amount || "0");
  document.getElementById("serviceLine").textContent = service ? service : "פרטי הזמנה";

  async function sendResult(status) {
    const statusEl = document.getElementById("status");
    statusEl.className = "status";
    statusEl.textContent = "שולח…";
    statusEl.style.display = "block";

    if (!webhookUrl) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאה: לא הוגדרה כתובת webhook. הוסף ?webhook=<המחלקת שלך> לכתובת הדף, או קבע DEFAULT_WEBHOOK_URL בקובץ.";
      return;
    }
    if (!bookingUid) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאה: לא התקבל booking_uid בכתובת הדף.";
      return;
    }

    const payload = {
      booking_uid: bookingUid,
      status: status,
      amount: Number(amount) || 0,
      transaction_id: "mock_" + Date.now()
    };

    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        statusEl.className = "status ok";
        statusEl.textContent = status === "paid"
          ? "✅ התשלום נשלח בהצלחה — חזור לטלגרם לקבלת אישור."
          : "התשלום סומן ככושל — חזור לטלגרם.";
      } else {
        statusEl.className = "status err";
        statusEl.textContent = "השרת החזיר שגיאה (" + res.status + "). בדוק את תרחיש ה-Make.";
      }
    } catch (err) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאת רשת בשליחה ל-Make: " + err.message;
    }
  }
</script>
</body>
</html>
