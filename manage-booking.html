<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowMind – ניהול תור</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f1117;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1a1d27;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9ea8; font-size: 14px; margin-bottom: 20px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #2a2d3a;
    font-size: 14px;
    text-align: right;
  }
  .row span:first-child { color: #9a9ea8; }
  .countdown-label { font-size: 13px; color: #9a9ea8; margin-top: 22px; }
  .countdown { font-size: 30px; font-weight: 700; margin: 6px 0 18px; letter-spacing: 1px; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .cancel-btn { background: #ff5a5a; color: #1a1d27; }
  .confirm-btn { background: #34d17c; color: #0f1117; }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .status.ok { background: rgba(52,209,124,0.15); color: #34d17c; display: block; }
  .status.err { background: rgba(255,90,90,0.15); color: #ff5a5a; display: block; }
  .waiting-msg { font-size: 18px; font-weight: 600; margin: 22px 0 6px; }
  .waiting-sub { font-size: 14px; color: #9a9ea8; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="serviceLine">טוען פרטי תור…</h1>
    <div class="sub" id="dateLine">–</div>

    <div class="row"><span>מזהה תור</span><span id="bookingUid">–</span></div>

    <div id="cancelState" style="display:none">
      <div class="countdown-label">ניתן לבטל עוד</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <button class="cancel-btn" onclick="sendAction('cancel')">❌ ביטול תור</button>
    </div>

    <div id="waitingState" style="display:none">
      <div class="waiting-msg">מצפים לראותך! 💈</div>
      <div class="waiting-sub">לא ניתן לבטל בשלב זה — פחות משעתיים לתור.</div>
      <button class="confirm-btn" id="confirmBtn" onclick="sendAction('confirm_attendance')" style="display:none">✅ הגעתי</button>
    </div>

    <div id="pastState" style="display:none">
      <div class="waiting-msg">תודה שהיית אצלנו! 💈</div>
    </div>

    <div id="status" class="status"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const bookingUid = params.get("booking_uid") || "";
  const startAtRaw = params.get("start_at") || "";  // expected DD/MM/YYYY HH:mm
  const service = params.get("service") || "";
  const chatId = params.get("chat_id") || "";
  const DEFAULT_WEBHOOK_URL = "https://hook.eu1.make.com/hshaaruid4jd1t13pvadqdl3crhlqj4n";
  const webhookUrl = params.get("webhook") || DEFAULT_WEBHOOK_URL;

  document.getElementById("bookingUid").textContent = bookingUid || "—";
  document.getElementById("serviceLine").textContent = service || "פרטי תור";

  // Parse DD/MM/YYYY HH:mm into a Date object
  function parseStart(raw) {
    const m = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
    if (!m) return null;
    const [, dd, mm, yyyy, hh, min] = m;
    return new Date(`${yyyy}-${mm}-${dd}T${hh}:${min}:00`);
  }

  const startDate = parseStart(startAtRaw);
  document.getElementById("dateLine").textContent = startAtRaw || "–";

  const cancelState = document.getElementById("cancelState");
  const waitingState = document.getElementById("waitingState");
  const pastState = document.getElementById("pastState");
  const confirmBtn = document.getElementById("confirmBtn");
  const countdownEl = document.getElementById("countdown");

  let alreadyCancelled = false;

  async function checkStatusOnLoad() {
    if (!webhookUrl || !bookingUid) return;
    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ booking_uid: bookingUid, action: "check_status" })
      });
      const data = await res.json().catch(() => ({}));
      if (data.booking_status === "cancelled") {
        alreadyCancelled = true;
        cancelState.style.display = "none";
        waitingState.style.display = "none";
        pastState.style.display = "block";
        pastState.querySelector(".waiting-msg").textContent = "התור כבר בוטל.";
      }
    } catch (err) {
      // status check failing shouldn't block the page — fall through to normal countdown logic
    }
  }

  const CUTOFF_MS = 2 * 60 * 60 * 1000;   // 2 hours before start — cancellation cutoff
  const CONFIRM_WINDOW_MS = 60 * 60 * 1000; // show confirm button until 1h after start

  function render() {
    if (alreadyCancelled) return;
    if (!startDate) {
      pastState.style.display = "block";
      pastState.querySelector(".waiting-msg").textContent = "שגיאה בטעינת פרטי התור.";
      return;
    }
    const now = new Date();
    const cutoff = new Date(startDate.getTime() - CUTOFF_MS);
    const confirmEnd = new Date(startDate.getTime() + CONFIRM_WINDOW_MS);

    if (now < cutoff) {
      cancelState.style.display = "block";
      waitingState.style.display = "none";
      pastState.style.display = "none";
      const diff = cutoff - now;
      const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
      const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
      const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
      countdownEl.textContent = `${h}:${m}:${s}`;
    } else if (now < confirmEnd) {
      cancelState.style.display = "none";
      waitingState.style.display = "block";
      pastState.style.display = "none";
      // show the attendance-confirm button only from the start time onward (day-of, once appointment begins)
      confirmBtn.style.display = now >= startDate ? "block" : "none";
    } else {
      cancelState.style.display = "none";
      waitingState.style.display = "none";
      pastState.style.display = "block";
    }
  }

  checkStatusOnLoad().then(() => {
    render();
    setInterval(render, 1000);
  });

  async function sendAction(action) {
    const statusEl = document.getElementById("status");
    statusEl.className = "status";
    statusEl.textContent = "שולח…";
    statusEl.style.display = "block";

    if (!webhookUrl) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאה: לא הוגדרה כתובת webhook.";
      return;
    }

    const payload = { booking_uid: bookingUid, action: action, chat_id: chatId };

    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        if (data.status === "already_actioned") {
          statusEl.className = "status ok";
          statusEl.textContent = "כבר טופל בעבר — אין צורך לפעול שוב.";
          cancelState.style.display = "none";
          waitingState.style.display = "none";
          return;
        }
        statusEl.className = "status ok";
        statusEl.textContent = action === "cancel"
          ? "✅ התור בוטל. חזור לטלגרם לאישור."
          : "✅ תודה! חזור לטלגרם.";
        cancelState.style.display = "none";
        waitingState.style.display = "none";
      } else {
        statusEl.className = "status err";
        statusEl.textContent = "שגיאה מהשרת (" + res.status + ").";
      }
    } catch (err) {
      statusEl.className = "status err";
      statusEl.textContent = "שגיאת רשת: " + err.message;
    }
  }
</script>
</body>
</html>
